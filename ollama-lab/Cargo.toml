[package]
name = "ollama-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
ns-engine = { version = "0.1.0", path = "../ns-engine" }
ollama-rs = { version = "0.3.6", features = ["stream"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
