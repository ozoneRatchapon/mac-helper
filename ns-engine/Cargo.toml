[package]
name = "ns-engine"
version = "0.1.0"
edition = "2021"
description = "Modelless neuro-symbolic inference engine — draft, prune, verify"
license = "MIT"

[dependencies]
blake3 = "1"
fastrand = "2"
regex-automata = "0.4"
wasmi = { version = "1.1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
wat = "1"

[features]
default = []
wasm-pruner = ["dep:wasmi"]
